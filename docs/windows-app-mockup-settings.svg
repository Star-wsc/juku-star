<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F5F7"/>
      <stop offset="100%" stop-color="#E8E8ED"/>
    </linearGradient>
    <linearGradient id="sb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ECECF1"/>
      <stop offset="100%" stop-color="#E4E4EA"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4D9FFF"/>
      <stop offset="100%" stop-color="#6C5CE7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <clipPath id="win"><rect x="40" y="36" width="1200" height="728" rx="18"/></clipPath>
    <!-- switch clip shapes -->
    <clipPath id="swOn"><rect x="1128" y="312" width="52" height="32" rx="16"/></clipPath>
    <clipPath id="swOff"><rect x="1128" y="392" width="52" height="32" rx="16"/></clipPath>
    <clipPath id="swOn2"><rect x="1128" y="552" width="52" height="32" rx="16"/></clipPath>
    <clipPath id="swOff2"><rect x="1128" y="632" width="52" height="32" rx="16"/></clipPath>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>
  <circle cx="1100" cy="80" r="180" fill="#4D9FFF" opacity="0.06"/>
  <circle cx="120" cy="720" r="200" fill="#6C5CE7" opacity="0.05"/>

  <g filter="url(#shadow)">
    <rect x="40" y="36" width="1200" height="728" rx="18" fill="#FFFFFF"/>
  </g>
  <g clip-path="url(#win)">
    <rect x="40" y="36" width="1200" height="52" fill="#F7F7FA"/>
    <rect x="40" y="36" width="1200" height="52" fill="url(#sb)" opacity="0.35"/>
    <circle cx="72" cy="62" r="6" fill="#FF5F57"/>
    <circle cx="92" cy="62" r="6" fill="#FEBC2E"/>
    <circle cx="112" cy="62" r="6" fill="#28C840"/>
    <text x="640" y="67" text-anchor="middle" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#6E6E73" font-weight="500">设置</text>

    <!-- sidebar -->
    <rect x="40" y="88" width="176" height="676" fill="url(#sb)"/>
    <text x="72" y="145" font-family="-apple-system,PingFang SC,sans-serif" font-size="14" fill="#6E6E73">剧库</text>
    <text x="72" y="197" font-family="-apple-system,PingFang SC,sans-serif" font-size="14" fill="#6E6E73">追剧</text>
    <text x="72" y="241" font-family="-apple-system,PingFang SC,sans-serif" font-size="14" fill="#6E6E73">下载</text>
    <text x="72" y="285" font-family="-apple-system,PingFang SC,sans-serif" font-size="14" fill="#6E6E73">历史</text>
    <rect x="52" y="308" width="152" height="40" rx="12" fill="url(#accent)" opacity="0.12"/>
    <rect x="52" y="308" width="4" height="40" rx="2" fill="#4D9FFF"/>
    <text x="72" y="333" font-family="-apple-system,PingFang SC,sans-serif" font-size="14" fill="#1D1D1F" font-weight="600">设置</text>

    <!-- title -->
    <text x="248" y="128" font-family="-apple-system,PingFang SC,sans-serif" font-size="28" fill="#1D1D1F" font-weight="700">设置</text>
    <text x="248" y="152" font-family="-apple-system,PingFang SC,sans-serif" font-size="13" fill="#6E6E73">外观与播放偏好 · 开关一律靠右</text>

    <!-- card 1: appearance -->
    <g filter="url(#soft)"><rect x="248" y="188" width="960" height="140" rx="16" fill="#F5F5F7"/></g>
    <text x="272" y="220" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" fill="#4D9FFF" font-weight="600">外观</text>
    <text x="272" y="256" font-family="-apple-system,PingFang SC,sans-serif" font-size="15" fill="#1D1D1F" font-weight="500">深色模式</text>
    <text x="272" y="280" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" fill="#6E6E73">跟随系统或强制浅色/深色</text>
    <!-- ON switch RIGHT -->
    <rect x="1128" y="232" width="52" height="32" rx="16" fill="url(#accent)"/>
    <circle cx="1164" cy="248" r="13" fill="#fff" filter="url(#soft)"/>
    <text x="1154" y="220" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#8E8E93">开关在右</text>

    <!-- card 2: playback -->
    <g filter="url(#soft)"><rect x="248" y="348" width="960" height="180" rx="16" fill="#F5F5F7"/></g>
    <text x="272" y="380" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" fill="#4D9FFF" font-weight="600">播放</text>
    <text x="272" y="416" font-family="-apple-system,PingFang SC,sans-serif" font-size="15" fill="#1D1D1F" font-weight="500">自动播放下一集</text>
    <rect x="1128" y="392" width="52" height="32" rx="16" fill="url(#accent)"/>
    <circle cx="1164" cy="408" r="13" fill="#fff"/>
    <rect x="272" y="448" width="904" height="1" fill="#E5E5EA"/>
    <text x="272" y="488" font-family="-apple-system,PingFang SC,sans-serif" font-size="15" fill="#1D1D1F" font-weight="500">默认倍速</text>
    <!-- speed chips -->
    <rect x="920" y="468" width="56" height="28" rx="14" fill="#ECECF1"/>
    <text x="948" y="487" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" fill="#1D1D1F">0.5x</text>
    <rect x="984" y="468" width="56" height="28" rx="14" fill="url(#accent)"/>
    <text x="1012" y="487" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" fill="#fff" font-weight="600">1.0x</text>
    <rect x="1048" y="468" width="56" height="28" rx="14" fill="#ECECF1"/>
    <text x="1076" y="487" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" fill="#1D1D1F">1.5x</text>
    <rect x="1112" y="468" width="56" height="28" rx="14" fill="#ECECF1"/>
    <text x="1140" y="487" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" fill="#1D1D1F">2.0x</text>

    <!-- card 3: library -->
    <g filter="url(#soft)"><rect x="248" y="548" width="960" height="180" rx="16" fill="#F5F5F7"/></g>
    <text x="272" y="580" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" fill="#4D9FFF" font-weight="600">剧库</text>
    <text x="272" y="616" font-family="-apple-system,PingFang SC,sans-serif" font-size="15" fill="#1D1D1F" font-weight="500">随机排序</text>
    <text x="272" y="640" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" fill="#6E6E73">每次刷新重新洗牌</text>
    <rect x="1128" y="552" width="52" height="32" rx="16" fill="#ECECF1"/>
    <circle cx="1144" cy="568" r="13" fill="#fff" filter="url(#soft)"/>
    <rect x="272" y="664" width="904" height="1" fill="#E5E5EA"/>
    <text x="272" y="700" font-family="-apple-system,PingFang SC,sans-serif" font-size="15" fill="#1D1D1F" font-weight="500">下拉刷新时更新服务器剧库</text>
    <text x="272" y="722" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" fill="#6E6E73">默认关闭：仅刷新界面快照</text>
    <rect x="1128" y="632" width="52" height="32" rx="16" fill="#ECECF1"/>
    <circle cx="1144" cy="648" r="13" fill="#fff" filter="url(#soft)"/>
  </g>
</svg>
